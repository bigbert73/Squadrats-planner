server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # GPX / KML imports and saved routes are bigger than nginx's 1 MB default;
    # the backend applies its own, stricter limits per request.
    client_max_body_size 32m;

    # The app is one 300 kB HTML file: compressed it is a quarter of that.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain application/xml;

    # Proxy API and auth to backend container (it sets its own security headers)
    location ~ ^/(api|auth)/ {
        proxy_pass         http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_buffering    off;  # needed for SSE
        proxy_cache        off;
        proxy_read_timeout 300s;
    }

    # Public page of a shared route: the backend fills in its title for link previews
    location ^~ /s/ {
        proxy_pass         http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    # Not part of the site
    location = /nginx.conf { return 404; }
    location = /shared.html { return 404; }   # a template, served filled in under /s/<token>
    location ^~ /docs/tools/ { return 404; }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    }
}
